<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tvarin — Applications</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e6e8eb;
        --accent: #2f6fed;
        --ok: #067647;
        --warn: #b45309;
        --bad: #b42318;
        --radius: 14px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
      a { color: var(--accent); }
      .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 64px; }

      header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
      .brand__mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; }
      .brand__mark svg { width: 17px; height: 17px; }
      .user { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }

      .btn { border: 1px solid var(--border); background: #fff; color: var(--fg); border-radius: 10px; padding: 9px 14px; font: 600 14px var(--font); cursor: pointer; }
      .btn:hover { background: #f3f4f6; }
      .btn--primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      .btn--primary:hover { filter: brightness(1.05); }

      .hero { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 48px 32px; text-align: center; }
      .hero h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -0.02em; }
      .hero p { margin: 0 auto 22px; max-width: 46ch; color: var(--muted); line-height: 1.5; }

      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
      .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
      .stat__num { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      .stat__label { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

      .bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #eef0f3; margin-bottom: 20px; }
      .bar > span { display: block; }
      .seg--started { background: #cbd5e1; }
      .seg--applied { background: #60a5fa; }
      .seg--interviewing { background: #f59e0b; }
      .seg--offer { background: #10b981; }
      .seg--rejected { background: #ef4444; }

      .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .chip { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 12px; font: 600 13px var(--font); color: var(--muted); cursor: pointer; }
      .chip.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }

      .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      .table-scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; min-width: 640px; }
      th, td { text-align: left; padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #f0f1f3; vertical-align: middle; }
      th { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
      tr:last-child td { border-bottom: none; }
      .job__title { font-weight: 600; }
      .job__title a { text-decoration: none; }
      .job__title a:hover { text-decoration: underline; }
      .muted { color: var(--muted); }
      select.status { font: 600 13px var(--font); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: #fff; cursor: pointer; }
      .status--applied { color: #1e40af; }
      .status--interviewing { color: var(--warn); }
      .status--offer { color: var(--ok); }
      .status--rejected { color: var(--bad); }
      .del { border: none; background: none; color: #9ca3af; font-size: 18px; cursor: pointer; line-height: 1; }
      .del:hover { color: var(--bad); }

      .empty { padding: 44px 24px; text-align: center; color: var(--muted); line-height: 1.6; }
      .msg { text-align: center; color: var(--muted); padding: 40px; }
      [hidden] { display: none !important; }

      @media (max-width: 640px) {
        .stats { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <span class="brand__mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h7l-2.5 8L20 8h-7l2.5-8L4 12z" fill="currentColor"/></svg></span>
          Tvarin
        </div>
        <div class="user" data-el="user"></div>
      </header>

      <div class="msg" data-el="loading">Loading…</div>

      <section data-el="signed-out" hidden>
        <div class="hero">
          <h1>Your applications</h1>
          <p>Sign in to see and analyze every job you've applied to with the Tvarin extension — statuses, response rate, and more.</p>
          <button class="btn btn--primary" data-el="signin">Sign in with Google</button>
        </div>
      </section>

      <section data-el="signed-in" hidden>
        <div class="stats" data-el="stats"></div>
        <div class="bar" data-el="bar" hidden></div>
        <div class="filters" data-el="filters"></div>
        <div class="panel">
          <div class="table-scroll">
            <table>
              <thead>
                <tr><th>Role</th><th>Company</th><th>Source</th><th>Status</th><th>Updated</th><th></th></tr>
              </thead>
              <tbody data-el="rows"></tbody>
            </table>
          </div>
          <div class="empty" data-el="empty" hidden>
            No applications yet. Fill and submit jobs with the Tvarin extension and they'll appear here.
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
