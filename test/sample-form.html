<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample Job Application — Tvarin test</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #d1d5db;
        --input-bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --border: #4b5563;
          --input-bg: #1f2937;
        }
      }
      body {
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { font-size: 22px; color: var(--fg); }
      p.note { color: var(--muted); }
      label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; color: var(--fg); }
      input, textarea, select {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        background: var(--input-bg);
        color: var(--fg);
      }
      input:focus { outline: 2px solid #4f46e5; outline-offset: 1px; }
      button { margin-top: 20px; padding: 10px 18px; border-radius: 8px; border: 0; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Senior Frontend Engineer</h1>
    <p class="note">
      Sample form for testing Tvarin. Set up your profile, then click the Tvarin
      toolbar button → “Fill this page”. Field labels here deliberately vary in
      wording to exercise the heuristic matcher.
    </p>

    <form>
      <label for="a">First Name</label>
      <input id="a" name="first_name" type="text" />

      <label for="b">Surname</label>
      <input id="b" name="last_name" type="text" />

      <label for="c">E-mail Address</label>
      <input id="c" name="applicant_email" type="email" />

      <label for="cc">Phone Country Code</label>
      <input id="cc" name="phone_country_code" type="text" />

      <label for="d">Mobile Number</label>
      <input id="d" name="tel" type="tel" />

      <label for="e">Street Address</label>
      <input id="e" name="addr1" type="text" />

      <label for="f">Town / City</label>
      <input id="f" name="city" type="text" />

      <label for="g">State</label>
      <input id="g" name="region" type="text" />

      <label for="h">ZIP / Postcode</label>
      <input id="h" name="zip" type="text" />

      <label for="i">Country</label>
      <input id="i" name="country" type="text" />

      <label for="j">LinkedIn Profile</label>
      <input id="j" name="linkedin_url" type="url" />

      <label for="k">GitHub</label>
      <input id="k" name="github" type="url" />

      <label for="l">Personal Website</label>
      <input id="l" name="portfolio" type="url" />

      <label for="m">Full Name (confirm)</label>
      <input id="m" name="full_name" type="text" />

      <button type="button">Submit application</button>
    </form>
  </body>
</html>
